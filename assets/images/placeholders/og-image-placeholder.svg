<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title-og">
  <title id="title-og">Nossa Pizza — imagen provisional para redes sociales</title>
  <defs>
    <linearGradient id="bgOg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16324a"/>
      <stop offset="100%" stop-color="#0f2233"/>
    </linearGradient>
    <radialGradient id="crustOg" cx="50%" cy="45%" r="65%">
      <stop offset="78%" stop-color="#e7b85c"/>
      <stop offset="100%" stop-color="#c8892f"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgOg)"/>
  <circle cx="880" cy="315" r="230" fill="url(#crustOg)"/>
  <circle cx="880" cy="315" r="196" fill="#f0c14b"/>
  <g fill="#b8382c">
    <circle cx="800" cy="230" r="16"/><circle cx="950" cy="250" r="14"/><circle cx="830" cy="380" r="15"/>
    <circle cx="960" cy="370" r="13"/><circle cx="890" cy="300" r="14"/>

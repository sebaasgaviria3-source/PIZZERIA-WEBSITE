  <text x="90" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#ec7d2c" font-weight="700">Pizza</text>
  <text x="92" y="430" font-family="Arial, sans-serif" font-size="26" fill="#e7dcc4">Sabor brasileño, hecho con pasión</text>
